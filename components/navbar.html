<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar - tech.no</title>
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="logo">
            <img src="../assets/images/logo-techno.png" alt="Tech.no Logo">
        </a>

        <div class="search-container">
            <input
                type="search"
                id="search-input"
                placeholder="Tìm điện thoại, laptop, PC, phụ kiện..."
                autocomplete="off"
                aria-label="Tìm kiếm sản phẩm"
            >
            <button class="search-btn" type="button" onclick="focusOnSearchBar()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        
        <ul class="nav-links">
            <li id="admin-nav-link" style="display: none;"><a href="/pages/admin/admin-tongquan.html">Admin</a></li>
            <li id="home-nav-link"><a href="/index.html" class="active">Trang chủ</a></li>
            <li><a href="/pages/phone.html">Điện thoại</a></li>
            <li><a href="/pages/laptop.html">Laptop</a></li>
            <li><a href="/pages/pc.html">PC</a></li>
            <li><a href="/pages/phu-kien.html">Phụ kiện</a></li>
            <li>
                <a
                    href="/pages/gio-hang.html"
                    class="nav-cart-link"
                    data-cart-nav-link
                    aria-label="Giỏ hàng"
                >
                    Giỏ hàng
                    <span
                        class="nav-cart-badge"
                        data-cart-count
                        aria-hidden="true"
                        hidden
                    >0</span>
                </a>
            </li>
            <li id="auth-status">
                <a href="/pages/login.html" class="login-btn">Đăng nhập</a>
            </li>
            <li id="notification-nav" class="notification-nav" hidden>
                <div class="notification-center">
                    <button
                        type="button"
                        class="notification-trigger"
                        data-notification-trigger
                        aria-label="Thông báo"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="notification-panel"
                    >
                        <i class="fa-regular fa-bell" aria-hidden="true"></i>
                        <span
                            class="notification-unread-dot"
                            data-notification-dot
                            aria-hidden="true"
                            hidden
                        ></span>
                        <span
                            class="notification-visually-hidden"
                            data-notification-status
                        >Không có thông báo mới</span>
                    </button>

                    <section
                        id="notification-panel"
                        class="notification-panel"
                        data-notification-panel
                        aria-label="Danh sách thông báo"
                        hidden
                    >
                        <header class="notification-panel__header">
                            <div>
                                <p class="notification-panel__eyebrow">Tài khoản</p>
                                <h2>Thông báo</h2>
                            </div>
                            <button
                                type="button"
                                class="notification-mark-all"
                                data-notification-mark-all
                                hidden
                            >Đánh dấu đã đọc</button>
                        </header>

                        <div
                            class="notification-list"
                            data-notification-list
                            aria-live="polite"
                            aria-busy="true"
                        >
                            <p class="notification-state">Đang tải thông báo...</p>
                        </div>

                        <a
                            class="notification-panel__footer"
                            href="/pages/profile.html#orders"
                        >
                            Xem đơn hàng của tôi
                            <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                        </a>
                    </section>
                </div>
            </li>
        </ul>
    </nav>
</body>
</html>
