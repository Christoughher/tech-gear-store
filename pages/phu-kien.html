<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phụ kiện - Tech.no</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/category.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="category-main">
        <section class="category-hero accessory-hero">
            <div class="hero-overlay">
                <h1>Phụ Kiện</h1>

                <p>
                    Danh sách phụ kiện công nghệ dành cho laptop,
                    PC Gaming và góc làm việc cá nhân.
                </p>

                <div class="hero-benefits">
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Chính hãng 100%</span>
                            <span class="benefit-desc">Đảm bảo chất lượng</span>
                        </div>
                    </div>

                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-truck-fast"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Giao hàng nhanh</span>
                            <span class="benefit-desc">Toàn quốc</span>
                        </div>
                    </div>

                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-tags"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Giá tốt mỗi ngày</span>
                            <span class="benefit-desc">Nhiều ưu đãi hấp dẫn</span>
                        </div>
                    </div>
                </div>

                <div
                    class="hero-actions"
                    role="group"
                    aria-label="Lọc nhanh phụ kiện theo mức giá"
                >
                    <button
                        class="hero-action hero-action--primary is-active"
                        type="button"
                        data-accessory-price-filter="all"
                        aria-pressed="true"
                    >
                        Xem tất cả phụ kiện
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </button>

                    <button
                        class="hero-action"
                        type="button"
                        data-accessory-price-filter="under-2"
                        aria-pressed="false"
                    >
                        Dưới 2 triệu
                        <i class="fa-solid fa-tag" aria-hidden="true"></i>
                    </button>

                    <button
                        class="hero-action"
                        type="button"
                        data-accessory-price-filter="from-2"
                        aria-pressed="false"
                    >
                        Từ 2 triệu
                        <i class="fa-solid fa-coins" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="category-layout">
            <div class="category-controls">
                <aside class="category-filter">
                    <h3>Bộ lọc</h3>

                    <div class="filter-group" data-filter-field="subcategory">
                        <h4>Loại phụ kiện</h4>
                        <label><input type="checkbox" value="airpods"> Tai nghe</label>
                        <label><input type="checkbox" value="loa"> Loa</label>
                        <label><input type="checkbox" value="camera"> Camera</label>
                        <label><input type="checkbox" value="sac"> Sạc</label>
                        <label><input type="checkbox" value="dong-ho"> Đồng hồ</label>
                    </div>

                    <div class="filter-group">
                        <h4>Kết nối</h4>
                        <label><input type="checkbox"> Có dây</label>
                        <label><input type="checkbox"> Không dây</label>
                        <label><input type="checkbox"> Bluetooth</label>
                    </div>

                    <div class="filter-group">
                        <h4>Mức giá</h4>
                        <label><input type="checkbox"> Dưới 500 nghìn</label>
                        <label><input type="checkbox"> 500 nghìn - 2 triệu</label>
                        <label><input type="checkbox"> Trên 2 triệu</label>
                    </div>
                </aside>

                <div class="category-toolbar">
                    <div class="category-sort">
                        <select aria-label="Sắp xếp sản phẩm">
                            <option>Sắp xếp mặc định</option>
                            <option>Giá tăng dần</option>
                            <option>Giá giảm dần</option>
                            <option>Bán chạy</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="product-grid">
                <div class="products-empty-state">Đang tải sản phẩm...</div>
            </div>
        </section>
    </main>

    <div id="pagination-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
