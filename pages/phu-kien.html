<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phụ kiện - Tech.no</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/category.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="category-main">
        <section class="category-hero">
            <h1>Phụ kiện</h1>
            <p>
                Danh sách phụ kiện công nghệ dành cho laptop, PC Gaming và góc làm việc cá nhân,
                giúp nâng cao trải nghiệm học tập, làm việc và giải trí.
            </p>
        </section>

        <section class="category-toolbar">
            <div class="category-sort">
                <select>
                    <option>Sắp xếp mặc định</option>
                    <option>Giá tăng dần</option>
                    <option>Giá giảm dần</option>
                    <option>Bán chạy</option>
                </select>
            </div>
        </section>

        <section class="category-layout">
            <aside class="category-filter">
                <h3>Bộ lọc</h3>

                <div class="filter-group">
                    <h4>Loại phụ kiện</h4>
                    <label><input type="checkbox"> Chuột</label>
                    <label><input type="checkbox"> Bàn phím</label>
                    <label><input type="checkbox"> Tai nghe</label>
                    <label><input type="checkbox"> Màn hình</label>
                </div>

                <div class="filter-group">
                    <h4>Kết nối</h4>
                    <label><input type="checkbox"> Có dây</label>
                    <label><input type="checkbox"> Không dây</label>
                    <label><input type="checkbox"> Bluetooth</label>
                </div>

                <div class="filter-group">
                    <h4>Mức giá</h4>
                    <label><input type="checkbox"> Dưới 500 nghìn</label>
                    <label><input type="checkbox"> 500 nghìn - 2 triệu</label>
                    <label><input type="checkbox"> Trên 2 triệu</label>
                </div>
            </aside>

            <div class="product-grid">
                <div class="products-empty-state">Đang tải sản phẩm...</div>
            </div>
        </section>
    </main>

    <div id="pagination-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
