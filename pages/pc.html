<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Gaming - Tech.no</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/category.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="category-main">
        <section class="category-hero">
            <h1>PC Gaming</h1>
            <p>
                Các bộ PC Gaming hiệu năng cao, phù hợp chơi game, livestream, dựng video,
                thiết kế đồ họa và làm việc với các tác vụ nặng.
            </p>
        </section>

        <section class="category-toolbar">
            <div class="category-sort">
                <select>
                    <option>Sắp xếp mặc định</option>
                    <option>Giá tăng dần</option>
                    <option>Giá giảm dần</option>
                    <option>Cấu hình mạnh nhất</option>
                </select>
            </div>
        </section>

        <section class="category-layout">
            <aside class="category-filter">
                <h3>Bộ lọc</h3>

                <div class="filter-group">
                    <h4>CPU</h4>
                    <label><input type="checkbox"> Intel Core i5</label>
                    <label><input type="checkbox"> Intel Core i7</label>
                    <label><input type="checkbox"> AMD Ryzen 5</label>
                    <label><input type="checkbox"> AMD Ryzen 7</label>
                </div>

                <div class="filter-group">
                    <h4>Card đồ họa</h4>
                    <label><input type="checkbox"> GTX Series</label>
                    <label><input type="checkbox"> RTX 3060</label>
                    <label><input type="checkbox"> RTX 4060</label>
                    <label><input type="checkbox"> RTX 4070</label>
                </div>

                <div class="filter-group">
                    <h4>Mức giá</h4>
                    <label><input type="checkbox"> Dưới 20 triệu</label>
                    <label><input type="checkbox"> 20 - 35 triệu</label>
                    <label><input type="checkbox"> Trên 35 triệu</label>
                </div>
            </aside>

            <div class="product-grid">
                <div class="products-empty-state">Đang tải sản phẩm...</div>
            </div>
        </section>
    </main>

    <div id="pagination-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
