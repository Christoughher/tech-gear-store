<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Gaming - Tech.no</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/category.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="category-main">
        <section class="category-hero pc-hero">
            <div class="hero-overlay">
                <h1>PC Gaming</h1>

                <p>
                    Trải nghiệm các bộ PC Gaming cấu hình mạnh,
                    tối ưu hiệu suất cho học tập, làm việc và giải trí.
                </p>

                <div class="hero-benefits">
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-bolt"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Hiệu năng mạnh mẽ</span>
                            <span class="benefit-desc">Xử lý mọi tác vụ</span>
                        </div>
                    </div>

                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Linh kiện chính hãng</span>
                            <span class="benefit-desc">Bảo hành uy tín</span>
                        </div>
                    </div>

                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-gear"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Tùy chọn đa dạng</span>
                            <span class="benefit-desc">Build theo nhu cầu</span>
                        </div>
                    </div>
                </div>

                <div
                    class="hero-actions"
                    role="group"
                    aria-label="Lọc nhanh PC theo mức giá"
                >
                    <button
                        class="hero-action hero-action--primary is-active"
                        type="button"
                        data-pc-price-filter="all"
                        aria-pressed="true"
                    >
                        Xem tất cả PC
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </button>

                    <button
                        class="hero-action"
                        type="button"
                        data-pc-price-filter="under-20"
                        aria-pressed="false"
                    >
                        Dưới 20 triệu
                        <i class="fa-solid fa-tag" aria-hidden="true"></i>
                    </button>

                    <button
                        class="hero-action"
                        type="button"
                        data-pc-price-filter="from-20"
                        aria-pressed="false"
                    >
                        Từ 20 triệu
                        <i class="fa-solid fa-coins" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>


        <section class="category-layout">
            <div class="category-controls">
                <aside class="category-filter">
                    <h3>Bộ lọc</h3>

                    <div class="filter-group filter-group--brands" data-filter-field="brand" data-logo-set="pc">
                        <h4>Thương hiệu</h4>
                        <label class="brand-filter-option" data-brand="asus" title="ASUS">
                            <input type="checkbox" value="asus" aria-label="Lọc theo ASUS">
                            <img src="/assets/images/brand-logo/laptop/asus.png" alt="ASUS">
                        </label>
                        <label class="brand-filter-option" data-brand="msi" title="MSI">
                            <input type="checkbox" value="msi" aria-label="Lọc theo MSI">
                            <img src="/assets/images/brand-logo/pc/msi.png" alt="MSI">
                        </label>
                        <label class="brand-filter-option" data-brand="gigabyte" title="Gigabyte">
                            <input type="checkbox" value="gigabyte" aria-label="Lọc theo Gigabyte">
                            <img src="/assets/images/brand-logo/pc/gigabyte.png" alt="Gigabyte">
                        </label>
                    </div>

                    <div class="filter-group">
                        <h4>CPU</h4>
                        <label><input type="checkbox"> Intel Core i5</label>
                        <label><input type="checkbox"> Intel Core i7</label>
                        <label><input type="checkbox"> AMD Ryzen 5</label>
                        <label><input type="checkbox"> AMD Ryzen 7</label>
                    </div>

                    <div class="filter-group">
                        <h4>Card đồ họa</h4>
                        <label><input type="checkbox"> GTX Series</label>
                        <label><input type="checkbox"> RTX 3060</label>
                        <label><input type="checkbox"> RTX 4060</label>
                        <label><input type="checkbox"> RTX 4070</label>
                    </div>

                    <div class="filter-group">
                        <h4>Mức giá</h4>
                        <label><input type="checkbox"> Dưới 20 triệu</label>
                        <label><input type="checkbox"> 20 - 35 triệu</label>
                        <label><input type="checkbox"> Trên 35 triệu</label>
                    </div>
                </aside>

                <div class="category-toolbar">
                    <div class="category-sort">
                        <select data-product-sort aria-label="Sắp xếp sản phẩm">
                            <option value="default">Sắp xếp mặc định</option>
                            <option value="price-asc">Giá tăng dần</option>
                            <option value="price-desc">Giá giảm dần</option>
                            <option value="newest">Mới nhất</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="product-grid">
                <div class="products-empty-state">Đang tải sản phẩm...</div>
            </div>
        </section>
    </main>

    <div id="pagination-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
