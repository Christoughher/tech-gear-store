<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop - Tech.no</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/category.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="category-main">
        <section class="category-hero laptop-hero">
    <div class="hero-overlay">
        <h1>Laptop</h1>

        <p>
            Khám phá các mẫu laptop chính hãng phù hợp cho học tập,
            làm việc và gaming với hiệu năng ổn định.
        </p>

    <div class="hero-benefits">

    <div class="benefit-item">

        <div class="benefit-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="benefit-content">
            <span class="benefit-title">Chính hãng 100%</span>
            <span class="benefit-desc">Đầy đủ VAT</span>
        </div>

    </div>

    <div class="benefit-item">

        <div class="benefit-icon">
            <i class="fa-solid fa-truck-fast"></i>
        </div>

        <div class="benefit-content">
            <span class="benefit-title">Miễn phí giao hàng</span>
            <span class="benefit-desc">Toàn quốc</span>
        </div>

    </div>

    <div class="benefit-item">

        <div class="benefit-icon">
            <i class="fa-solid fa-headset"></i>
        </div>

        <div class="benefit-content">
            <span class="benefit-title">Trả góp 0%</span>
            <span class="benefit-desc">Lãi suất ưu đãi</span>
        </div>

    </div>

</div>
</section>

        <section class="category-toolbar">
            <div class="category-sort">
                <select>
                    <option>Sắp xếp mặc định</option>
                    <option>Giá tăng dần</option>
                    <option>Giá giảm dần</option>
                    <option>Mới nhất</option>
                </select>
            </div>
        </section>

        <section class="category-layout">
            <aside class="category-filter">
                <h3>Bộ lọc</h3>

                <div class="filter-group">
                    <h4>Thương hiệu</h4>
                    <label><input type="checkbox"> ASUS</label>
                    <label><input type="checkbox"> Dell</label>
                    <label><input type="checkbox"> HP</label>
                    <label><input type="checkbox"> Lenovo</label>
                </div>

                <div class="filter-group">
                    <h4>Mức giá</h4>
                    <label><input type="checkbox"> Dưới 15 triệu</label>
                    <label><input type="checkbox"> 15 - 25 triệu</label>
                    <label><input type="checkbox"> Trên 25 triệu</label>
                </div>

                <div class="filter-group">
                    <h4>Nhu cầu</h4>
                    <label><input type="checkbox"> Học tập</label>
                    <label><input type="checkbox"> Văn phòng</label>
                    <label><input type="checkbox"> Gaming</label>
                    <label><input type="checkbox"> Đồ họa</label>
                </div>
            </aside>

            <div class="product-grid">
                <div class="products-empty-state">Đang tải sản phẩm...</div>
            </div>
        </section>
    </main>

    <div id="pagination-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
