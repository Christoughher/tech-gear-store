<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop - Tech.no</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/category.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="category-main">
        <section class="category-hero laptop-hero">
            <div class="hero-overlay">
                <h1>Laptop</h1>

                <p>
                    Khám phá các mẫu laptop chính hãng phù hợp cho học tập,
                    làm việc và gaming với hiệu năng ổn định.
                </p>

                <div class="hero-benefits">
                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Chính hãng 100%</span>
                            <span class="benefit-desc">Đầy đủ VAT</span>
                        </div>
                    </div>

                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-truck-fast"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Miễn phí giao hàng</span>
                            <span class="benefit-desc">Toàn quốc</span>
                        </div>
                    </div>

                    <div class="benefit-item">
                        <div class="benefit-icon">
                            <i class="fa-solid fa-headset"></i>
                        </div>

                        <div class="benefit-content">
                            <span class="benefit-title">Trả góp 0%</span>
                            <span class="benefit-desc">Lãi suất ưu đãi</span>
                        </div>
                    </div>
                </div>

                <div
                    class="hero-actions"
                    role="group"
                    aria-label="Lọc nhanh laptop theo mức giá"
                >
                    <button
                        class="hero-action hero-action--primary is-active"
                        type="button"
                        data-laptop-price-filter="all"
                        aria-pressed="true"
                    >
                        Xem tất cả laptop
                        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    </button>

                    <button
                        class="hero-action"
                        type="button"
                        data-laptop-price-filter="under-20"
                        aria-pressed="false"
                    >
                        Dưới 20 triệu
                        <i class="fa-solid fa-tag" aria-hidden="true"></i>
                    </button>

                    <button
                        class="hero-action"
                        type="button"
                        data-laptop-price-filter="from-20"
                        aria-pressed="false"
                    >
                        Từ 20 triệu
                        <i class="fa-solid fa-coins" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="category-layout">
            <div class="category-controls">
                <aside class="category-filter">
                    <h3>Bộ lọc</h3>

                    <div class="filter-group filter-group--brands" data-filter-field="brand" data-logo-set="laptop">
                        <h4>Thương hiệu</h4>
                        <label class="brand-filter-option" data-brand="asus" title="ASUS">
                            <input type="checkbox" value="asus" aria-label="Lọc theo ASUS">
                            <img src="/assets/images/brand-logo/laptop/asus.png" alt="ASUS">
                        </label>
                        <label class="brand-filter-option" data-brand="hp" title="HP">
                            <input type="checkbox" value="hp" aria-label="Lọc theo HP">
                            <img src="/assets/images/brand-logo/laptop/hp.png" alt="HP">
                        </label>
                        <label class="brand-filter-option" data-brand="dell" title="Dell">
                            <input type="checkbox" value="dell" aria-label="Lọc theo Dell">
                            <img src="/assets/images/brand-logo/laptop/dell.png" alt="Dell">
                        </label>
                        <label class="brand-filter-option" data-brand="lenovo" title="Lenovo">
                            <input type="checkbox" value="lenovo" aria-label="Lọc theo Lenovo">
                            <img src="/assets/images/brand-logo/laptop/lenovo.png" alt="Lenovo">
                        </label>
                        <label class="brand-filter-option" data-brand="acer" title="Acer">
                            <input type="checkbox" value="acer" aria-label="Lọc theo Acer">
                            <img src="/assets/images/brand-logo/laptop/acer.png" alt="Acer">
                        </label>
                        <label class="brand-filter-option" data-brand="macbook" title="MacBook">
                            <input type="checkbox" value="macbook" aria-label="Lọc theo MacBook">
                            <img src="/assets/images/brand-logo/laptop/macbook.png" alt="MacBook">
                        </label>
                        <label class="brand-filter-option" data-brand="msi" title="MSI">
                            <input type="checkbox" value="msi" aria-label="Lọc theo MSI">
                            <img src="/assets/images/brand-logo/laptop/msi.png" alt="MSI">
                        </label>
                        <label class="brand-filter-option" data-brand="gigabyte" title="Gigabyte">
                            <input type="checkbox" value="gigabyte" aria-label="Lọc theo Gigabyte">
                            <img src="/assets/images/brand-logo/laptop/gigabyte.png" alt="Gigabyte">
                        </label>
                    </div>

                    <div class="filter-group">
                        <h4>Mức giá</h4>
                        <label><input type="checkbox"> Dưới 15 triệu</label>
                        <label><input type="checkbox"> 15 - 25 triệu</label>
                        <label><input type="checkbox"> Trên 25 triệu</label>
                    </div>

                    <div class="filter-group">
                        <h4>Nhu cầu</h4>
                        <label><input type="checkbox"> Học tập</label>
                        <label><input type="checkbox"> Văn phòng</label>
                        <label><input type="checkbox"> Gaming</label>
                        <label><input type="checkbox"> Đồ họa</label>
                    </div>
                </aside>

                <div class="category-toolbar">
                    <div class="category-sort">
                        <select aria-label="Sắp xếp sản phẩm">
                            <option>Sắp xếp mặc định</option>
                            <option>Giá tăng dần</option>
                            <option>Giá giảm dần</option>
                            <option>Mới nhất</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="product-grid">
                <div class="products-empty-state">Đang tải sản phẩm...</div>
            </div>
        </section>
    </main>

    <div id="pagination-container"></div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
